name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# нов push в същия клон спира предишния билд
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # NativeScript CLI проверява и emulator (`emulator -help`) и adb (platform-tools).
      # Системен образ не е нужен – билдът не пуска емулатор.
      - name: Android SDK 36 + emulator
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools emulator platforms;android-36 build-tools;36.0.0

      - name: Зависимости
        run: npm ci

      - name: Проверка на типовете
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Форматиране (Prettier)
        run: npm run format:check

      - name: Тестове
        run: npm test

      - name: Проверка на средата (ns doctor)
        run: |
          npm install -g nativescript@9
          ns usage-reporting disable
          ns error-reporting disable
          ns doctor android

      - name: Билд
        run: ns build android

      - name: Качване на APK
        uses: actions/upload-artifact@v7
        with:
          name: my-car-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
